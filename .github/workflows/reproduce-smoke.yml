name: Reproduction smoke tests

on:
  push:
    branches: [reproduce-and-debug]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-smoke:
    name: CPU simulator and PRIMAL-CVaR checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 astropy==6.1.7 Pillow==11.2.1 rustworkx pandas tensorboard pytest
      - name: Compile project modules
        run: python -m compileall -q sat_net satnet_viewer run_train.py run_eval.py run_spf.py
      - name: Core invariants and simulator smoke tests
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-smoke-pytest
          path: test-results.xml
          if-no-files-found: warn
