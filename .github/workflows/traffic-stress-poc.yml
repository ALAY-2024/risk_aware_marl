name: traffic-stress-poc

on:
  push:
    branches: [traffic-stress-poc]
  workflow_dispatch:

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal simulation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy astropy rustworkx torch tensorboard

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_traffic_stress.py' -v

      - name: SPF traffic-stress PoC
        run: python -m experiments.run_traffic_stress_spf --seeds 11,22,33

      - name: SPF offered-load calibration on small geometry
        run: python -m experiments.run_load_sweep_spf --rates 0.10,0.25,0.50,1.00 --seeds 11,22,33

      - name: SPF offered-load calibration on full Starlink geometry
        run: >-
          python -m experiments.run_load_sweep_spf
          --config configs/traffic_stress_full_poc.json
          --rates 1.0,5.0,10.0
          --seeds 11
          --out-dir results/load_sweep_spf_full

      - name: Show aggregate results
        if: always()
        run: |
          for f in results/*/summary.csv; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              cat "$f"
            fi
          done

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-stress-poc-results
          path: results/
          if-no-files-found: warn
